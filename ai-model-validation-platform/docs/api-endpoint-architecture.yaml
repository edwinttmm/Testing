              schema:
                type: string

  # =============================================================================
  # WEBSOCKET EVENT SPECIFICATIONS
  # =============================================================================

  /ws:
    get:
      tags: [WebSocket]
      summary: WebSocket endpoint for real-time updates
      description: |
        WebSocket endpoint for real-time updates on:
        - Annotation changes
        - Ground truth generation progress
        - Export status updates
        - User activity notifications
        
        ## Connection
        - Requires valid JWT token in query parameter or Authorization header
        - Connection URL: `wss://api.domain.com/v1/ws?token=<jwt_token>`
        
        ## Event Types
        - `annotation_created`: New annotation created
        - `annotation_updated`: Annotation modified
        - `annotation_deleted`: Annotation removed
        - `ground_truth_progress`: Ground truth generation progress
        - `ground_truth_completed`: Ground truth generation finished
        - `export_progress`: Export progress update
        - `export_completed`: Export finished
        
        ## Message Format
        ```json
        {
          "event_type": "annotation_created",
          "data": { ... },
          "timestamp": "2025-01-01T00:00:00Z",
          "user_id": "uuid",
          "video_id": "uuid"
        }
        ```
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            description: JWT authentication token
      responses:
        '101':
          description: WebSocket connection established
        '401':
          description: Invalid or missing authentication token
        '403':
          description: Insufficient permissions

# =============================================================================
# RATE LIMITING AND CIRCUIT BREAKER CONFIGURATION
# =============================================================================

x-rate-limits:
  anonymous:
    - endpoint: "*"
      limit: 100
      window: 3600
      scope: ip
  authenticated:
    - endpoint: "*"
      limit: 1000
      window: 3600
      scope: user
    - endpoint: "/videos/*/upload"
      limit: 10
      window: 3600
      scope: user
    - endpoint: "/videos/*/ground-truth/generate"
      limit: 5
      window: 3600
      scope: user
    - endpoint: "/videos/*/export"
      limit: 20
      window: 3600
      scope: user
  premium:
    - endpoint: "*"
      limit: 10000
      window: 3600
      scope: user

x-circuit-breakers:
  database:
    failure_threshold: 5
    recovery_timeout: 60000
    half_open_max_calls: 3
  ml_inference:
    failure_threshold: 3
    recovery_timeout: 30000
    half_open_max_calls: 1
  external_services:
    failure_threshold: 10
    recovery_timeout: 120000
    half_open_max_calls: 5