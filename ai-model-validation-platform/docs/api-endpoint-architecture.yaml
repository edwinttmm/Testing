# SPARC Architecture Phase: API Endpoint Organization and Routing Architecture
# Comprehensive OpenAPI 3.0 specification for the unified system

openapi: 3.0.3
info:
  title: AI Model Validation Platform API
  version: 1.0.0
  description: |
    Comprehensive API for video annotation, ground truth management, and ML model validation.
    This API follows RESTful principles with comprehensive security, validation, and error handling.
    
    ## Architecture Principles
    - RESTful design with clear resource hierarchies
    - Comprehensive input validation and sanitization
    - Multi-layer security with JWT and OAuth2
    - Standardized error responses
    - Rate limiting and circuit breaker patterns
    - Comprehensive audit logging
    
    ## Authentication
    All endpoints require authentication unless explicitly marked as public.
    Supports JWT tokens and OAuth2 flows.
    
    ## Rate Limiting
    - Anonymous: 100 requests/hour
    - Authenticated users: 1000 requests/hour
    - Premium users: 10000 requests/hour
    
  contact:
    name: AI Model Validation Platform API Support
    email: api-support@domain.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.production.domain.com/v1
    description: Production API Server
  - url: https://api.staging.domain.com/v1
    description: Staging API Server
  - url: http://localhost:8080/v1
    description: Local Development Server

# =============================================================================
# SECURITY SCHEMES
# =============================================================================

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login
      
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.domain.com/oauth/authorize
          tokenUrl: https://auth.domain.com/oauth/token
          refreshUrl: https://auth.domain.com/oauth/refresh
          scopes:
            read: Read access to resources
            write: Write access to resources
            admin: Administrative access
            
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for service-to-service authentication

# =============================================================================
# COMMON SCHEMAS
# =============================================================================

  schemas:
    # Base response schemas
    SuccessResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          type: object
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
          
    ErrorResponse:
      type: object
      required: [success, error_code, message]
      properties:
        success:
          type: boolean
          example: false
        error_code:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "Invalid input provided"
        details:
          type: object
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string
          format: uuid
        meta:
          $ref: '#/components/schemas/ResponseMetadata'

    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            field_errors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
                  value:
                    type: string

    ResponseMetadata:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        rate_limit:
          $ref: '#/components/schemas/RateLimit'
        performance:
          $ref: '#/components/schemas/Performance'

    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
        total_pages:
          type: integer
        has_next:
          type: boolean
        has_previous:
          type: boolean

    RateLimit:
      type: object
      properties:
        limit:
          type: integer
        remaining:
          type: integer
        reset:
          type: string
          format: date-time

    Performance:
      type: object
      properties:
        response_time_ms:
          type: integer
        db_queries:
          type: integer
        cache_hits:
          type: integer

    # Core domain schemas
    User:
      type: object
      required: [id, username, email, role, status]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, annotator, validator, admin, super_admin]
        status:
          type: string
          enum: [active, inactive, locked, suspended]
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          maxLength: 255
        organization:
          type: string
          maxLength: 255
        mfa_enabled:
          type: boolean
        last_login:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Project:
      type: object
      required: [id, name, owner_id, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        owner_id:
          type: string
          format: uuid
        parent_project_id:
          type: string
          format: uuid
          nullable: true
        project_type:
          type: string
          enum: [standard, research, validation, benchmark]
        classification:
          type: string
          enum: [public, internal, confidential, secret]
        status:
          type: string
          enum: [active, archived, suspended, deleted]
        settings:
          type: object
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Video:
      type: object
      required: [id, project_id, filename, file_path, file_size]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        filename:
          type: string
          maxLength: 255
        original_filename:
          type: string
          maxLength: 255
        file_path:
          type: string
        file_size:
          type: integer
          minimum: 1
        file_hash:
          type: string
          minLength: 64
          maxLength: 64
        mime_type:
          type: string
        duration:
          type: number
          format: float
          minimum: 0
        fps:
          type: number
          format: float
          minimum: 0
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        processing_status:
          type: string
          enum: [pending, processing, completed, failed, cancelled]
        ground_truth_generated:
          type: boolean
        annotation_count:
          type: integer
          minimum: 0
        validated_annotation_count:
          type: integer
          minimum: 0
        quality_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
        uploaded_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Annotation:
      type: object
      required: [id, video_id, detection_id, frame_number, timestamp, vru_type, x, y, width, height, annotator]
      properties:
        id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        detection_id:
          type: string
          maxLength: 100
        frame_number:
          type: integer
          minimum: 0
        timestamp:
          type: number
          format: float
          minimum: 0
        end_timestamp:
          type: number
          format: float
          minimum: 0
          nullable: true
        vru_type:
          type: string
          enum: [pedestrian, cyclist, motorcyclist, wheelchair_user, other_vru]
        subclass:
          type: string
          maxLength: 50
        x:
          type: number
          format: float
          minimum: 0
          maximum: 1
        y:
          type: number
          format: float
          minimum: 0
          maximum: 1
        width:
          type: number
          format: float
          minimum: 0
          maximum: 1
        height:
          type: number
          format: float
          minimum: 0
          maximum: 1
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        visibility:
          type: number
          format: float
          minimum: 0
          maximum: 1
        occluded:
          type: boolean
        truncated:
          type: boolean
        difficult:
          type: boolean
        validated:
          type: boolean
        validation_status:
          type: string
          enum: [pending, approved, rejected, requires_changes]
        validation_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
        notes:
          type: string
          maxLength: 5000
        tags:
          type: array
          items:
            type: string
        annotator:
          type: string
          format: uuid
        validator:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GroundTruthObject:
      type: object
      required: [id, video_id, frame_number, timestamp, class_label, x, y, width, height, confidence]
      properties:
        id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        frame_number:
          type: integer
          minimum: 0
        timestamp:
          type: number
          format: float
          minimum: 0
        class_label:
          type: string
          maxLength: 50
        x:
          type: number
          format: float
          minimum: 0
          maximum: 1
        y:
          type: number
          format: float
          minimum: 0
          maximum: 1
        width:
          type: number
          format: float
          minimum: 0
          maximum: 1
        height:
          type: number
          format: float
          minimum: 0
          maximum: 1
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        validated:
          type: boolean
        difficult:
          type: boolean
        ml_model_name:
          type: string
        ml_model_version:
          type: string
        quality_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
        created_at:
          type: string
          format: date-time

# =============================================================================
# API ENDPOINTS
# =============================================================================

security:
  - bearerAuth: []
  - oauth2: [read, write]

paths:
  # =============================================================================
  # AUTHENTICATION ENDPOINTS
  # =============================================================================
  
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate user with username/password and optional MFA
      security: [] # Public endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 255
                password:
                  type: string
                  minLength: 8
                  maxLength: 255
                mfa_code:
                  type: string
                  pattern: "^[0-9]{6}$"
                remember_me:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                          refresh_token:
                            type: string
                          expires_at:
                            type: string
                            format: date-time
                          user:
                            $ref: '#/components/schemas/User'
        '202':
          description: MFA required
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          auth_session_id:
                            type: string
                            format: uuid
                          required_factors:
                            type: array
                            items:
                              type: string
                              enum: [totp, sms, email]
        '400':
          description: Invalid credentials or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/mfa/verify:
    post:
      tags: [Authentication]
      summary: Verify MFA challenge
      security: [] # Uses auth session ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_session_id, factors]
              properties:
                auth_session_id:
                  type: string
                  format: uuid
                factors:
                  type: object
                  properties:
                    totp:
                      type: object
                      properties:
                        code:
                          type: string
                          pattern: "^[0-9]{6}$"
                    sms:
                      type: object
                      properties:
                        code:
                          type: string
                          pattern: "^[0-9]{6}$"
      responses:
        '200':
          description: MFA verification successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                          refresh_token:
                            type: string
                          expires_at:
                            type: string
                            format: date-time
                          user:
                            $ref: '#/components/schemas/User'
        '400':
          description: Invalid MFA code or session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: User logout
      description: Invalidate current session
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                          refresh_token:
                            type: string
                          expires_at:
                            type: string
                            format: date-time

  # =============================================================================
  # USER MANAGEMENT ENDPOINTS
  # =============================================================================

  /users:
    get:
      tags: [Users]
      summary: List users
      description: Get paginated list of users (admin only)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: role
          in: query
          schema:
            type: string
            enum: [user, annotator, validator, admin, super_admin]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, locked, suspended]
        - name: search
          in: query
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Users]
      summary: Create new user
      description: Create a new user account (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password, role]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                  pattern: "^[a-zA-Z0-9_-]+$"
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                  maxLength: 255
                role:
                  type: string
                  enum: [user, annotator, validator, admin]
                first_name:
                  type: string
                  maxLength: 255
                last_name:
                  type: string
                  maxLength: 255
                organization:
                  type: string
                  maxLength: 255
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Users]
      summary: Update user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  maxLength: 255
                last_name:
                  type: string
                  maxLength: 255
                organization:
                  type: string
                  maxLength: 255
                role:
                  type: string
                  enum: [user, annotator, validator, admin]
                status:
                  type: string
                  enum: [active, inactive, suspended]
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

    delete:
      tags: [Users]
      summary: Delete user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # =============================================================================
  # PROJECT MANAGEMENT ENDPOINTS
  # =============================================================================

  /projects:
    get:
      tags: [Projects]
      summary: List projects
      description: Get paginated list of projects accessible to the user
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, suspended]
        - name: project_type
          in: query
          schema:
            type: string
            enum: [standard, research, validation, benchmark]
        - name: search
          in: query
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: Projects retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'

    post:
      tags: [Projects]
      summary: Create new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                description:
                  type: string
                  maxLength: 5000
                parent_project_id:
                  type: string
                  format: uuid
                project_type:
                  type: string
                  enum: [standard, research, validation, benchmark]
                  default: standard
                classification:
                  type: string
                  enum: [public, internal, confidential, secret]
                  default: internal
                settings:
                  type: object
                metadata:
                  type: object
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'

  /projects/{projectId}:
    get:
      tags: [Projects]
      summary: Get project by ID
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'

    put:
      tags: [Projects]
      summary: Update project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                description:
                  type: string
                  maxLength: 5000
                classification:
                  type: string
                  enum: [public, internal, confidential, secret]
                settings:
                  type: object
                metadata:
                  type: object
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'

    delete:
      tags: [Projects]
      summary: Delete project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # =============================================================================
  # VIDEO MANAGEMENT ENDPOINTS
  # =============================================================================

  /projects/{projectId}/videos:
    get:
      tags: [Videos]
      summary: List videos in project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: processing_status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, failed, cancelled]
        - name: ground_truth_generated
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Videos retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Video'

    post:
      tags: [Videos]
      summary: Upload video to project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [video_file]
              properties:
                video_file:
                  type: string
                  format: binary
                metadata:
                  type: object
                  properties:
                    description:
                      type: string
                    tags:
                      type: array
                      items:
                        type: string
      responses:
        '201':
          description: Video uploaded successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
