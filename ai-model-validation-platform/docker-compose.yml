version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: ai_validation_postgres
    hostname: postgres
    environment:
      POSTGRES_DB: ${VRU_DATABASE_NAME}
      POSTGRES_USER: ${VRU_DATABASE_USER}
      POSTGRES_PASSWORD: ${VRU_DATABASE_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - vru_validation_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VRU_DATABASE_USER} -d ${VRU_DATABASE_NAME}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    command: [
      "postgres",
      "-c", "log_statement=all",
      "-c", "log_destination=stderr",
      "-c", "logging_collector=off",
      "-c", "max_connections=200"
    ]

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: ai_validation_redis
    hostname: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vru_validation_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    command: redis-server --requirepass ${VRU_REDIS_PASSWORD} --appendonly yes

  # FastAPI Backend
  backend:
    build: ./backend
    container_name: ai_validation_backend
    hostname: backend
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      # Security
      - AIVALIDATION_SECRET_KEY=${VRU_SECRET_KEY}
      - SECRET_KEY=${VRU_SECRET_KEY}
      # Database - Unified PostgreSQL Configuration
      - AIVALIDATION_DATABASE_URL=${VRU_DATABASE_URL}
      - DATABASE_URL=${VRU_DATABASE_URL}
      # Redis - Unified Redis Configuration
      - AIVALIDATION_REDIS_URL=${VRU_REDIS_URL}
      - REDIS_URL=${VRU_REDIS_URL}
      # API Configuration
      - AIVALIDATION_API_PORT=${VRU_API_PORT}
      - AIVALIDATION_API_HOST=${VRU_API_HOST}
      - AIVALIDATION_APP_ENVIRONMENT=${VRU_ENVIRONMENT}
      - API_PORT=${VRU_API_PORT}
      - API_HOST=${VRU_API_HOST}
      # CORS Configuration - Unified Origins
      - AIVALIDATION_CORS_ORIGINS=${VRU_CORS_ORIGINS}
      - ALLOWED_ORIGINS=${VRU_CORS_ORIGINS}
      # Docker configuration
      - AIVALIDATION_DOCKER_MODE=${VRU_DOCKER_MODE}
      # Environment Variables
      - NODE_ENV=${NODE_ENV}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vru_validation_network
    volumes:
      - ./backend:/app
      - ./models:/app/models
      - uploaded_videos:/app/uploads
      # Mount for PostgreSQL persistence (remove SQLite mount)
      - postgres_migrations:/app/migrations
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    command: ["/app/scripts/wait-for-services.sh", "sh", "-c", "python simple_startup.py && uvicorn main:socketio_app --host 0.0.0.0 --port 8000"]

  # React Frontend
  frontend:
    build: ./frontend
    container_name: ai_validation_frontend
    hostname: frontend
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - REACT_APP_WS_URL=${REACT_APP_WS_URL}
      - REACT_APP_ML_ENGINE_URL=${REACT_APP_ML_ENGINE_URL}
      - REACT_APP_VIDEO_BASE_URL=${REACT_APP_VIDEO_BASE_URL}
      - REACT_APP_ENVIRONMENT=${REACT_APP_ENVIRONMENT}
      - REACT_APP_DEBUG=${REACT_APP_DEBUG}
      - NODE_ENV=${NODE_ENV}
      - GENERATE_SOURCEMAP=${GENERATE_SOURCEMAP}
      - CI=false
      - DOCKER=true
      - NODE_OPTIONS=--max_old_space_size=4096
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vru_validation_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # CVAT for annotation (optional, can be deployed separately)
  cvat_db:
    image: postgres:15
    container_name: ai_validation_cvat_db
    hostname: cvat_db
    environment:
      POSTGRES_DB: cvat
      POSTGRES_USER: root
      POSTGRES_PASSWORD: cvat_password
    volumes:
      - cvat_db:/var/lib/postgresql/data
    networks:
      - vru_validation_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d cvat"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cvat:
    image: openvino/cvat_server:latest
    container_name: ai_validation_cvat
    hostname: cvat
    restart: always
    depends_on:
      cvat_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # CVAT Redis Configuration - Unified
      CVAT_REDIS_HOST: ${VRU_REDIS_HOST}
      CVAT_REDIS_PASSWORD: ${VRU_REDIS_PASSWORD}
      # RQ (Redis Queue) Scheduler Configuration
      RQ_REDIS_HOST: ${VRU_REDIS_HOST}
      RQ_REDIS_PORT: ${VRU_REDIS_PORT}
      RQ_REDIS_PASSWORD: ${VRU_REDIS_PASSWORD}
      RQ_REDIS_DB: ${VRU_REDIS_DB}
      # Additional Redis configurations
      REDIS_HOST: ${VRU_REDIS_HOST}
      REDIS_PORT: ${VRU_REDIS_PORT}
      REDIS_PASSWORD: ${VRU_REDIS_PASSWORD}
      REDIS_DB: ${VRU_REDIS_DB}
      # Django Cache Configuration
      DJANGO_CACHE_REDIS_URL: ${VRU_REDIS_URL}
      # PostgreSQL Configuration
      CVAT_POSTGRES_HOST: cvat_db
      CVAT_POSTGRES_PASSWORD: cvat_password
      # Django Configuration
      DJANGO_MODWSGI_EXTRA_ARGS: ""
      # Debug settings for troubleshooting
      DJANGO_LOG_LEVEL: INFO
    ports:
      - "0.0.0.0:8080:8080"
    networks:
      - vru_validation_network
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/server/about"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  postgres_migrations:
  redis_data:
  uploaded_videos:
  cvat_db:
  cvat_data:
  cvat_keys:
  cvat_logs:

networks:
  vru_validation_network:
    driver: bridge
    name: vru_validation_network
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1