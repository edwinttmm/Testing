name: HIL Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - v8
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: '3.11'
  BACKEND_DIR: ./backend

jobs:
  # ============================================================================
  # Stage 1: Code Quality & Testing
  # ============================================================================

  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort mypy pylint

      - name: Check code formatting (Black)
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          black --check --diff .
        continue-on-error: true

      - name: Check import sorting (isort)
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          isort --check-only --diff .
        continue-on-error: true

      - name: Lint with flake8
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Python syntax validation
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          python -m py_compile main.py
          python -m py_compile config.py
          python -m py_compile database.py

      - name: Run unit tests
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          if [ -d "tests" ]; then
            pip install pytest pytest-cov pytest-asyncio
            pytest tests/ -v --cov=. --cov-report=xml --cov-report=html
          else
            echo "No tests directory found, skipping tests"
          fi
        continue-on-error: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ${{ env.BACKEND_DIR }}/coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true

  # ============================================================================
  # Stage 2: Security Scanning
  # ============================================================================

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety bandit

      - name: Security audit with Safety
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          safety check --json || true
        continue-on-error: true

      - name: Security scan with Bandit
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          bandit -r . -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            ${{ env.BACKEND_DIR }}/bandit-report.json
          retention-days: 30

  # ============================================================================
  # Stage 3: Build & Package
  # ============================================================================

  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clear Python cache
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          find . -type f -name "*.pyc" -delete
          find . -type d -name "__pycache__" -exec rm -rf {} + || true

      - name: Create deployment package
        run: |
          cd backend
          tar -czf ../backend-${{ github.sha }}.tar.gz \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            --exclude='.git' \
            --exclude='*.log' \
            --exclude='dev_database.db' \
            .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package-${{ github.sha }}
          path: backend-${{ github.sha }}.tar.gz
          retention-days: 7

  # ============================================================================
  # Stage 4: Deploy to Staging
  # ============================================================================

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: http://staging.hil-backend.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-package-${{ github.sha }}

      - name: Deploy to staging server
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # Example: scp, rsync, or cloud deployment

          # For demonstration:
          echo "Deployment package: backend-${{ github.sha }}.tar.gz"
          echo "Would deploy to staging server here"

      - name: Run smoke tests on staging
        run: |
          echo "Running smoke tests on staging..."
          # Add staging smoke tests here
          # curl http://staging.hil-backend.example.com/health

  # ============================================================================
  # Stage 5: Deploy to Production
  # ============================================================================

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: http://hil-backend.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-package-${{ github.sha }}

      - name: Deploy to production server
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here

          # Example deployment workflow:
          # 1. Upload package to server
          # 2. SSH into server
          # 3. Run pre-deployment checks
          # 4. Execute deployment script
          # 5. Run post-deployment validation

          echo "Deployment package: backend-${{ github.sha }}.tar.gz"
          echo "Would deploy to production server here"

      - name: Run production health checks
        run: |
          echo "Running production health checks..."
          # Add production health checks here
          # ./backend/scripts/post-deploy-validation.sh

  # ============================================================================
  # Stage 6: Post-Deployment Validation
  # ============================================================================

  post-deployment-validation:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always() && (github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run validation tests
        run: |
          echo "Running post-deployment validation..."
          # Add validation tests here
          # curl http://hil-backend.example.com/api/health
          # curl http://hil-backend.example.com/api/database/health

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deployment and validation successful"
          # Add notification logic (Slack, email, etc.)

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment validation failed"
          # Add notification logic and rollback trigger

  # ============================================================================
  # Rollback Job (Manual Trigger)
  # ============================================================================

  rollback:
    name: Emergency Rollback
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'rollback'
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute rollback
        run: |
          echo "Executing emergency rollback..."
          # SSH to server and run rollback script
          # ./backend/scripts/rollback.sh

      - name: Verify rollback
        run: |
          echo "Verifying rollback success..."
          # Add verification checks

      - name: Notify rollback completion
        run: |
          echo "Rollback completed"
          # Add notification

# ============================================================================
# Workflow Notifications
# ============================================================================

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan, build, deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Determine workflow status
        id: status
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "status=✅ Success" >> $GITHUB_OUTPUT
          else
            echo "status=❌ Failed" >> $GITHUB_OUTPUT
          fi

      - name: Send notification
        run: |
          echo "Workflow Status: ${{ steps.status.outputs.status }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          # Add your notification logic here (Slack, Discord, email, etc.)
