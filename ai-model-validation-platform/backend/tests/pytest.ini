[tool:pytest]
# Pytest configuration for workflow validation tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --color=yes

# Markers
markers =
    sequential: Sequential video processing tests
    frontend: Frontend integration tests  
    automation: End-to-end automation tests
    specific: Specific video files tests
    workflow: Workflow validation tests
    integration: Integration tests
    performance: Performance tests
    slow: Tests that take a long time to run

# Test timeout (in seconds)
timeout = 300

# Async support
asyncio_mode = auto

# Minimum version
minversion = 6.0