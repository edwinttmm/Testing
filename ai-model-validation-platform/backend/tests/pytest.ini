[pytest]
# Pytest configuration for ground truth fix tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum coverage requirement
addopts =
    --verbose
    --tb=short
    --strict-markers
    --cov=services
    --cov=crud
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=90
    -ra

# Test markers
markers =
    performance: Performance benchmark tests
    integration: Integration tests
    slow: Slow-running tests
    unit: Fast unit tests
    phase4: Phase 4 validation tests that prove all 7 critical issues are solved
    hardware: Hardware integration tests (LabJack, cameras, etc.)

# Coverage settings
[coverage:run]
source = services,crud
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
skip_covered = False
show_missing = True

[coverage:html]
directory = htmlcov
