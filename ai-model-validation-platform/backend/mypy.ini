[mypy]
# Python version
python_version = 3.12

# Import discovery
mypy_path = src
namespace_packages = True
explicit_package_bases = True

# Platform configuration
platform = linux

# Strictness levels
strict = False
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_any_unimported = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

# Error messages
show_error_context = True
show_column_numbers = True
show_error_codes = True
pretty = True
color_output = True

# Incremental mode
incremental = True
cache_dir = .mypy_cache

# Treat missing imports as errors
ignore_missing_imports = True

# Per-module options for critical services
[mypy-src.services.dedicated_labjack_monitor]
disallow_untyped_defs = False
check_untyped_defs = True

[mypy-src.services.video_lifecycle_orchestrator]
disallow_untyped_defs = False
check_untyped_defs = True

[mypy-src.services.clock_sync_service_v2]
disallow_untyped_defs = False
check_untyped_defs = True

[mypy-src.services.drift_measurement_service]
disallow_untyped_defs = False
check_untyped_defs = True

[mypy-src.services.drift_monitoring_service]
disallow_untyped_defs = False
check_untyped_defs = True

# Ignore third-party packages without stubs
[mypy-cv2.*]
ignore_missing_imports = True

[mypy-labjack.*]
ignore_missing_imports = True

[mypy-u3.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-alembic.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True
